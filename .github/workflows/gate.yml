name: gate

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 의존성이 없는지 확인
        run: |
          if [ -d node_modules ]; then
            echo "node_modules가 커밋되어 있습니다"
            exit 1
          fi
          node -e "
            const p = require('./package.json');
            const deps = { ...(p.dependencies ?? {}), ...(p.devDependencies ?? {}) };
            const names = Object.keys(deps);
            if (names.length > 0) {
              console.error('package.json에 의존성이 있습니다: ' + names.join(', '));
              process.exit(1);
            }
          "

      - name: gate
        run: npm run gate

      - name: doctor
        run: npm run doctor
